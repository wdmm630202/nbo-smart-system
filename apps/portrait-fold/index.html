r.result);mode(full);notice('图片已替换，下载网页即可保存')};r.readAsDataURL(f)}}upload(document.querySelector('#screenFile'),'#screenImage',true);document.querySelector('#restore').onclick=()=>{compareMode();updateCompare(50);for(const side of ['before','after']){document.querySelector('#'+side+'Align').value=50;document.querySelector('#'+side+'Photo').setAttribute('preserveAspectRatio','xMidYMid slice')}};const comparison=document.querySelector('#comparison'),handle=document.querySelector('#compareHandle'),scene=document.querySelector('#scene');
function buildProjectedPhotos(){const ns='http://www.w3.org/2000/svg';for(const side of ['before','after']){const root=document.querySelector('#'+side+'Warp');root.replaceChildren();const count=256,width=998/count;for(let i=0;i<count;i++){const x=125+i*width;const center=x+width/2;const bend=Math.max(0,1-Math.abs(center-624)/499);const top=595.5,bottom=1435;const strip=document.createElementNS(ns,'svg');strip.setAttribute('x',x-.8);strip.setAttribute('y',top);strip.setAttribute('width',width+1.6);strip.setAttribute('height',bottom-top);strip.setAttribute('viewBox',(x-.8)+' 615 '+(width+1.6)+' 800');strip.setAttribute('preserveAspectRatio','none');strip.setAttribute('overflow','hidden');const image=document.createElementNS(ns,'use');image.setAttribute('href','#'+side+'Photo');strip.append(image);root.append(strip)}}}

for(const side of ['before','after']){document.querySelector('#'+side+'File').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024){notice('请选择小于 20MB 的 JPG、PNG 或 WebP 图片');return}const reader=new FileReader;reader.onload=()=>{const check=new Image;check.onload=()=>{document.querySelector('#'+side+'Photo').setAttribute('href',reader.result);comparison.dataset[side+'Ready']='yes';compareMode();updateDemo();notice('图片已替换')};check.onerror=()=>notice('图片无法读取，请换一张');check.src=reader.result};reader.readAsDataURL(f)};document.querySelector('#'+side+'Align').oninput=e=>{const n=Number(e.target.value);document.querySelector('#'+side+'Photo').setAttribute('preserveAspectRatio','xMidY'+(n<34?'Min':n>66?'Max':'Mid')+' slice')}}

document.querySelector('#download').onclick=async()=>{try{let copy=document.documentElement.cloneNode(true);for(const img of copy.querySelectorAll('svg image')){let href=img.getAttribute('href');if(!href||href.startsWith('data:'))continue;let response=await fetch(href);if(!response.ok)throw Error();let blob=await response.blob();let data=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});img.setAttribute('href',data)}copy.querySelector('#photoEditor')?.remove();copy.querySelector('#fields').innerHTML='';copy.querySelector('#beforeWarp').replaceChildren();copy.querySelector('#afterWarp').replaceChildren();copy.querySelector('#panel').classList.add('hidden');copy.querySelector('#edit').textContent='编辑画面';copy.querySelector('#notice').style.display='none';copy.querySelectorAll('input[type=range]').forEach(el=>el.setAttribute('value',document.getElementById(el.id).value));let url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='南铂写真-真实手机-3比4.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notice('已下载，双击文件可继续编辑')}catch(e){notice('下载失败，请刷新后重试')}};
  function capsulePath(context, x, y, width, height) {
    const radius = Math.min(height / 2, width / 2);
    const centerY = y + height / 2;
    context.beginPath();
    context.moveTo(x + radius, y);
    context.lineTo(x + width - radius, y);
    context.arc(x + width - radius, centerY, radius, -Math.PI / 2, Math.PI / 2);
    context.lineTo(x + radius, y + height);
    context.arc(x + radius, centerY, radius, Math.PI / 2, Math.PI * 1.5);
    context.closePath();
  }

  function drawComparisonCapsule(context, capsule, word, outputScale) {
    const x = capsule.right - capsule.width;
    const onePhysicalPixel = 1 / Math.max(.01, outputScale);
    context.save();
    context.shadowColor = "rgba(0,0,0,.24)";
    context.shadowBlur = Math.max(3, 8 * outputScale);
    context.shadowOffsetY = Math.max(1, 2 * outputScale);
    capsulePath(context, x, capsule.y, capsule.width, capsule.height);
    const shellGradient = context.createLinearGradient(0, capsule.y, 0, capsule.y + capsule.height);
    shellGradient.addColorStop(0, "rgba(120,120,124,.58)");
    shellGradient.addColorStop(.14, "rgba(70,70,74,.78)");
    shellGradient.addColorStop(.62, "rgba(43,43,46,.78)");
    shellGradient.addColorStop(1, "rgba(28,28,31,.72)");
    context.fillStyle = shellGradient;
    context.fill();
    context.shadowColor = "transparent";
    context.lineWidth = Math.max(1.1, onePhysicalPixel);
    context.strokeStyle = "rgba(255,255,255,.34)";
    context.stroke();
    context.shadowColor = "rgba(255,255,255,.3)";
    context.shadowBlur = Math.max(2, 6 * outputScale);
    context.shadowOffsetY = -Math.max(1, 2 * outputScale);
    context.lineWidth = Math.max(1.5, onePhysicalPixel);
    context.strokeStyle = "rgba(255,255,255,.48)";
    context.stroke();

    const circleRadius = capsule.width * (19 / 104);
    const circleX = x + capsule.width * (76.5 / 104);
    const circleY = capsule.y + capsule.height / 2;
    context.shadowColor = "rgba(0,0,0,.2)";
    context.shadowBlur = Math.max(2, 4 * outputScale);
    context.shadowOffsetY = Math.max(.5, outputScale);
    context.beginPath();
    context.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
    const buttonGradient = context.createLinearGradient(0, circleY - circleRadius, 0, circleY + circleRadius);
    buttonGradient.addColorStop(0, "rgba(255,255,255,.99)");
    buttonGradient.addColorStop(.55, "rgba(239,239,241,.98)");
    buttonGradient.addColorStop(1, "rgba(205,205,208,.97)");
    context.fillStyle = buttonGradient;
    context.fill();
    context.shadowColor = "transparent";
    context.lineWidth = Math.max(1.2, onePhysicalPixel);
    context.strokeStyle = "rgba(255,255,255,.9)";
    context.stroke();

    context.textBaseline = "middle";
    context.textAlign = "center";
    const labelFontSize = Math.round(capsule.width * (18 / 104));
    context.font = `700 ${labelFontSize}px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif`;

const pe=document.createElement('section');pe.id='photoEditor';pe.innerHTML='<h3>照片取景</h3><select id="photoTarget"><option value="before">左侧素颜</option><option value="after">右侧成片</option><option value="single">精修单张</option></select>';

function constrainPhoto(n,v){
 const w=Number(n.getAttribute('width')),h=Number(n.getAttribute('height'));
 const a=v.angle*Math.PI/180,c=Math.cos(a),t=Math.sin(a);
 // Inverse-rotate the destination rectangle into photo coordinates.
 const rw=Math.abs(c)*w+Math.abs(t)*h,rh=Math.abs(t)*w+Math.abs(c)*h;
 const scale=Math.max(v.zoom/100,rw/w,rh/h)+0.00001;
 const mx=Math.max(0,(w*scale-rw)/2),my=Math.max(0,(h*scale-rh)/2);
 const lx=Math.max(-mx,Math.min(mx,c*v.x+t*v.y)),ly=Math.max(-my,Math.min(my,-t*v.x+c*v.y));
 v.x=c*lx-t*ly;v.y=t*lx+c*ly;
 return scale;
}
function applyPhotos(){for(const side of Object.keys(photoNodes)){const n=photoNodes[side],v=state[side],safeScale=constrainPhoto(n,v);const cx=Number(n.getAttribute('x'))+Number(n.getAttribute('width'))/2,cy=Number(n.getAttribute('y'))+Number(n.getAttribute('height'))/2;n.setAttribute('transform','translate('+v.x+' '+v.y+') translate('+cx+' '+cy+') rotate('+v.angle+') scale('+safeScale+') translate('+(-cx)+' '+(-cy)+')');n.dataset.view=JSON.stringify(v)}syncPhoto()}

const originalMode=mode;mode=function(full){originalMode(full);selectPhoto(full?'single':'before');pe.querySelector('option[value="single"]').hidden=!full;pe.querySelector('option[value="before"]').hidden=full;pe.querySelector('option[value="after"]').hidden=full};

 ctx.fillStyle=cs.color;ctx.font=cs.fontWeight+' '+fs*scale+'px '+cs.fontFamily;ctx.textBaseline='middle';ctx.textAlign=cs.textAlign==='center'?'center':'left';ctx.letterSpacing=(parseFloat(cs.letterSpacing)||0)*scale+'px';

 const pad=n=>String(n).padStart(2,'0'),d=new Date(),stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());

}
