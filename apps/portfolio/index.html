<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10100f" />
    <meta
      name="description"
      content="南铂摄影真实男士客片：商务西装、日常松弛、情绪光影与个人形象。"
    />
    <title>南铂摄影｜真实客片</title>
    <link rel="preload" as="image" href="assets/photos/photo-01.webp" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero" aria-labelledby="page-title">
        <div class="hero-media" aria-hidden="true">
          <img
            id="hero-image"
            src="assets/photos/photo-01.webp"
            alt=""
            width="1080"
            height="1440"
            fetchpriority="high"
          />
          <div class="hero-shade"></div>
        </div>

        <div class="hero-topbar">
          <a class="brand" href="#top" aria-label="返回顶部">
            <span class="brand-mark">N</span>
            <span class="brand-name">南铂摄影</span>
          </a>
          <span class="truth-chip">真实客片</span>
        </div>

        <div class="hero-copy" id="top">
          <p class="eyebrow">NANBO MEN'S PORTRAIT</p>
          <h1 id="page-title">拍下真实的你</h1>
          <p class="hero-intro">先看看我们最近拍过的照片，喜欢哪种感觉，直接告诉我就好。</p>
          <a class="scroll-cue" href="#gallery" aria-label="查看全部客片">
            <span>查看客片</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" />
            </svg>
          </a>
        </div>
      </header>

      <main>
        <section class="gallery-section" id="gallery" aria-labelledby="gallery-title">
          <div class="section-heading">
            <div>
              <p class="section-kicker">RECENT WORK</p>
              <h2 id="gallery-title">最近客片</h2>
            </div>
            <p class="section-note">点击照片可全屏查看</p>
          </div>

          <nav class="filter-wrap" aria-label="按风格筛选客片">
            <div class="filter-list" id="filters"></div>
          </nav>

          <div class="gallery-grid" id="gallery-grid" aria-live="polite"></div>
        </section>

        <section class="promise" aria-label="南铂拍摄服务特点">
          <p class="section-kicker">OUR PROMISE</p>
          <h2>不用会摆动作，<br />做你自己就好。</h2>
          <div class="promise-list">
            <span>真实客片</span>
            <span>全程动作指导</span>
            <span>明码实价</span>
            <span>无强制消费</span>
          </div>
          <p class="promise-footnote">页面照片均为展示模板，请替换为已获得展示授权的真实客片。</p>
        </section>
      </main>

      <footer class="footer">
        <span class="brand-mark brand-mark-small">N</span>
        <p>南铂摄影 · 男士写真与上门拍摄</p>
        <p class="copyright">© <span id="year"></span> NANBO STUDIO</p>
      </footer>
    </div>

    <div class="floating-cta-wrap" aria-label="咨询操作">
      <button class="floating-cta" id="style-cta" type="button">
        <span>
          <small>已经有喜欢的感觉？</small>
          <strong>选一种风格，复制发给我</strong>
        </span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </button>
    </div>

    <dialog class="viewer" id="viewer" aria-label="全屏查看客片">
      <div class="viewer-surface">
        <button class="icon-button viewer-close" id="viewer-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="viewer-stage" id="viewer-stage">
          <img id="viewer-image" alt="" />
        </div>
        <button class="viewer-arrow viewer-prev" id="viewer-prev" type="button" aria-label="上一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <button class="viewer-arrow viewer-next" id="viewer-next" type="button" aria-label="下一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
        </button>
        <div class="viewer-caption">
          <div>
            <strong id="viewer-title"></strong>
            <span id="viewer-count"></span>
          </div>
          <button id="viewer-copy" type="button">喜欢这张</button>
        </div>
      </div>
    </dialog>

    <dialog class="style-sheet" id="style-sheet" aria-labelledby="style-sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading">
        <div>
          <p class="section-kicker">TELL US</p>
          <h2 id="style-sheet-title">你喜欢哪种感觉？</h2>
        </div>
        <button class="icon-button" id="sheet-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="style-options" id="style-options"></div>
      <p class="sheet-tip">点击后会复制一句话，返回微信直接粘贴给我。</p>
    </dialog>

    <div class="dialog-scrim" id="dialog-scrim" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">请开启浏览器 JavaScript 后查看客片。</p>
    </noscript>

    <script src="app.js" defer></script>
  </body>
</html>
