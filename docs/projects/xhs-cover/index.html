<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>南铂真实客片封面</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23fee800%22/><path d=%22M18 46V18h7l14 18V18h7v28h-7L25 28v18z%22 fill=%22%23111%22/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">NANBO PHOTO</p>
      <h1>真实客片封面</h1>
      <p class="subtitle">换照片、改两行字，直接导出小红书封面</p>
    </div>
    <div class="privacy-pill"><span></span>照片只在本机处理</div>
  </header>

  <main class="workspace">
    <section class="preview-panel" aria-label="封面预览">
      <div class="canvas-shell">
        <canvas id="coverCanvas" width="1080" height="1440" aria-label="3比4小红书封面预览"></canvas>
        <div class="canvas-hint">可直接拖动主图调整位置</div>
      </div>
      <div class="preview-actions">
        <button id="loadExample" class="button secondary" type="button">加载这组示例</button>
        <button id="exportButton" class="button primary" type="button">导出高清 PNG</button>
      </div>
      <p id="status" class="status" aria-live="polite">请先添加成片</p>
    </section>

    <section class="controls" aria-label="封面设置">
      <div class="control-card">
        <p class="step-label">01 · 选择版式</p>
        <div class="segmented" role="group" aria-label="版式">
          <button type="button" class="mode-button active" data-mode="compare" aria-pressed="true">真实前后</button>
          <button type="button" class="mode-button" data-mode="single" aria-pressed="false">单张视觉</button>
        </div>
      </div>

      <div class="control-card">
        <p class="step-label">02 · 替换照片</p>
        <label class="upload-row">
          <span><strong>成片</strong><small id="afterName">选择主视觉照片</small></span>
          <span class="upload-button">选择照片</span>
          <input id="afterInput" type="file" accept="image/*">
        </label>
        <label id="beforeUpload" class="upload-row">
          <span><strong>拍摄前素颜照</strong><small id="beforeName">用于右下角真实对比</small></span>
          <span class="upload-button">选择照片</span>
          <input id="beforeInput" type="file" accept="image/*">
        </label>
      </div>

      <div class="control-card">
        <p class="step-label">03 · 修改封面字</p>
        <label class="field">
          <span>上行 · 白色</span>
          <input id="line1" type="text" value="不会摆动作" maxlength="20">
          <small id="line1Warning" class="warning"></small>
        </label>
        <label class="field">
          <span>下行 · 南铂黄</span>
          <input id="line2" type="text" value="也能拍得自然" maxlength="20">
          <small id="line2Warning" class="warning"></small>
        </label>
      </div>

      <details class="control-card adjustments">
        <summary>照片位置微调</summary>
        <div class="slider-grid">
          <label>主图大小<input id="zoom" type="range" min="1" max="2.2" step="0.01" value="1"></label>
          <label>主图左右<input id="offsetX" type="range" min="-1" max="1" step="0.01" value="0"></label>
          <label>主图上下<input id="offsetY" type="range" min="-1" max="1" step="0.01" value="0"></label>
          <div id="beforeAdjustments">
            <label>素颜照大小<input id="beforeZoom" type="range" min="1" max="2.2" step="0.01" value="1.17"></label>
            <label>到店照左右<input id="beforeOffsetX" type="range" min="-1" max="1" step="0.01" value="0"></label>
            <label>到店照上下<input id="beforeOffsetY" type="range" min="-1" max="1" step="0.01" value="0"></label>
          </div>
        </div>
        <button id="resetButton" class="text-button" type="button">恢复默认位置</button>
      </details>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
